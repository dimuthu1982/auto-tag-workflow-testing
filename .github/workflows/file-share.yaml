name: File Share
run-name: File Share
on: [push]
jobs:
    set-file:
        name: Set File
        runs-on: ubuntu-latest
        steps: 
        - uses: actions/checkout@v4
    
        - name: Share File
          run: |
                pwd
                ls -lart

        - uses: actions/upload-artifact@v4
          with:
            name: testFile
            path: ./test.txt
            retention-days: 1
        
    get-file:
        name: Get File
        runs-on: ubuntu-latest
        needs: set-file
        steps: 
            - uses: actions/download-artifact@v4
              with:
               name: testFile
               #path: .
            
            - run: |
                pwd
                ls -lart
                echo "Printing File ..."
                cat test.txt